<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBS Live Translate - 控制面板</title>
<style>
  :root {
    --bg: #1e1e2e;
    --surface: #2a2a3e;
    --text: #cdd6f4;
    --text-secondary: #a6adc8;
    --accent: #89b4fa;
    --accent-hover: #74c7ec;
    --danger: #f38ba8;
    --success: #a6e3a1;
    --warning: #f9e2af;
    --border: #45475a;
    --radius: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 13px;
    padding: 16px;
    overflow-y: auto;
    height: 100vh;
  }

  h1 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
    color: var(--accent);
  }

  .subtitle {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }

  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }

  .section h2 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--accent);
  }

  .form-group {
    margin-bottom: 10px;
  }

  .form-group:last-child { margin-bottom: 0; }

  label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
    font-weight: 500;
  }

  input[type="text"],
  input[type="password"],
  input[type="number"],
  input[type="url"],
  select {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, select:focus {
    border-color: var(--accent);
  }

  .row {
    display: flex;
    gap: 10px;
  }

  .row .form-group { flex: 1; }

  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--bg);
  }

  .btn-primary:hover { background: var(--accent-hover); }

  .btn-danger {
    background: var(--danger);
    color: var(--bg);
  }

  .btn-danger:hover { opacity: 0.9; }

  .btn-success {
    background: var(--success);
    color: var(--bg);
  }

  .btn-group {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #666;
    flex-shrink: 0;
  }

  .status-dot.connected { background: var(--success); }
  .status-dot.disconnected { background: var(--danger); }
  .status-dot.speaking { background: var(--accent); }

  .status-text {
    flex: 1;
    font-size: 12px;
  }

  .audio-meter {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }

  .audio-meter-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.1s;
    border-radius: 2px;
  }

  .subtitle-preview {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    min-height: 40px;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    word-break: break-word;
  }

  .log-area {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    max-height: 120px;
    overflow-y: auto;
    font-size: 11px;
    font-family: 'Consolas', 'Courier New', monospace;
    color: var(--text-secondary);
  }

  .log-entry { padding: 2px 0; }
  .log-entry.warn { color: var(--warning); }
  .log-entry.error { color: var(--danger); }
  .log-entry.success { color: var(--success); }

  .toggle {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
  }

  .toggle input { opacity: 0; width: 0; height: 0; }

  .toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--border);
    border-radius: 22px;
    transition: 0.3s;
  }

  .toggle-slider:before {
    content: "";
    position: absolute;
    height: 16px;
    width: 16px;
    left: 3px;
    bottom: 3px;
    background: var(--text);
    border-radius: 50%;
    transition: 0.3s;
  }

  input:checked + .toggle-slider {
    background: var(--accent);
  }

  input:checked + .toggle-slider:before {
    transform: translateX(18px);
  }

  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 0;
  }
</style>
</head>
<body>

<h1>OBS Live Translate</h1>
<p class="subtitle">实时字幕翻译控制面板</p>

<!-- 状态栏 -->
<div class="status-bar">
  <div class="status-dot disconnected" id="statusDot"></div>
  <span class="status-text" id="statusText">未连接</span>
  <div style="flex:1;margin-left:8px;">
    <div class="audio-meter"><div class="audio-meter-fill" id="audioMeter" style="width:0%"></div></div>
  </div>
</div>

<!-- 字幕预览 -->
<div class="section">
  <h2>字幕预览</h2>
  <div class="subtitle-preview" id="subtitlePreview">等待字幕...</div>
</div>

<!-- API设置 -->
<div class="section">
  <h2>API 设置</h2>
  <div class="form-group">
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="输入你的API Key">
  </div>
  <div class="form-group">
    <label>API Base URL</label>
    <input type="url" id="apiBaseUrl" value="https://dashscope.aliyuncs.com/compatible-mode/v1">
  </div>
  <div class="form-group">
    <label>模型名称</label>
    <input type="text" id="modelName" value="qwen3.5-livetranslate-flash-realtime">
  </div>
  <button class="btn btn-primary" onclick="saveSettings()" style="width:100%">保存设置</button>
</div>

<!-- 功能开关 -->
<div class="section">
  <h2>功能设置</h2>
  <div class="toggle-row">
    <span>音乐检测</span>
    <label class="toggle">
      <input type="checkbox" id="musicDetection" checked>
      <span class="toggle-slider"></span>
    </label>
  </div>
  <div class="toggle-row">
    <span>自动语言检测</span>
    <label class="toggle">
      <input type="checkbox" id="autoLangDetect" checked>
      <span class="toggle-slider"></span>
    </label>
  </div>
  <div class="form-group" style="margin-top:8px;">
    <label>静音阈值</label>
    <input type="number" id="silenceThreshold" value="0.02" step="0.001" min="0.001" max="0.5">
  </div>
  <div class="form-group">
    <label>字幕显示时长 (秒)</label>
    <input type="number" id="displayTime" value="5" step="0.5" min="1" max="30">
  </div>
</div>

<!-- 操作按钮 -->
<div class="btn-group">
  <button class="btn btn-success" id="btnStart" onclick="toggleServer()" style="flex:1">启动服务</button>
  <button class="btn btn-danger" id="btnStop" onclick="toggleServer()" style="flex:1;display:none">停止服务</button>
</div>

<!-- 日志 -->
<div class="section" style="margin-top:12px;">
  <h2>日志</h2>
  <div class="log-area" id="logArea">
    <div class="log-entry">等待连接...</div>
  </div>
</div>

<script>
(function() {
  const WS_URL = 'ws://127.0.0.1:9559';
  let ws = null;
  let reconnectTimer = null;

  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const audioMeter = document.getElementById('audioMeter');
  const subtitlePreview = document.getElementById('subtitlePreview');
  const logArea = document.getElementById('logArea');
  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');

  let isServerRunning = false;

  function addLog(msg, level) {
    level = level || '';
    const entry = document.createElement('div');
    entry.className = 'log-entry ' + level;
    const time = new Date().toLocaleTimeString();
    entry.textContent = '[' + time + '] ' + msg;
    logArea.appendChild(entry);
    logArea.scrollTop = logArea.scrollHeight;

    while (logArea.children.length > 50) {
      logArea.removeChild(logArea.firstChild);
    }
  }

  function connect() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
      return;
    }

    ws = new WebSocket(WS_URL);

    ws.onopen = function() {
      statusDot.className = 'status-dot connected';
      statusText.textContent = '已连接';
      addLog('已连接到服务器', 'success');
      isServerRunning = true;
      updateButtons();
    };

    ws.onmessage = function(event) {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'subtitle') {
          subtitlePreview.textContent = data.text;
        } else if (data.type === 'status_update') {
          const level = data.data.audio_level || 0;
          const pct = Math.min(100, Math.max(0, level * 500));
          audioMeter.style.width = pct + '%';

          if (data.data.detection === 'speech') {
            statusDot.className = 'status-dot connected speaking';
          } else {
            statusDot.className = 'status-dot connected';
          }
        }
      } catch (e) {}
    };

    ws.onclose = function() {
      statusDot.className = 'status-dot disconnected';
      statusText.textContent = '未连接';
      audioMeter.style.width = '0%';
      isServerRunning = false;
      updateButtons();
      addLog('连接已断开', 'warn');
      scheduleReconnect();
    };

    ws.onerror = function() {
      addLog('连接错误', 'error');
    };
  }

  function scheduleReconnect() {
    if (!reconnectTimer) {
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connect();
      }, 3000);
    }
  }

  function updateButtons() {
    if (isServerRunning) {
      btnStart.style.display = 'none';
      btnStop.style.display = 'block';
    } else {
      btnStart.style.display = 'block';
      btnStop.style.display = 'none';
    }
  }

  function saveSettings() {
    const settings = {
      api_key: document.getElementById('apiKey').value,
      api_base_url: document.getElementById('apiBaseUrl').value,
      model: document.getElementById('modelName').value,
      music_detection: document.getElementById('musicDetection').checked,
      auto_language_detect: document.getElementById('autoLangDetect').checked,
      silence_threshold: parseFloat(document.getElementById('silenceThreshold').value),
      subtitle_display_time: parseFloat(document.getElementById('displayTime').value),
    };

    localStorage.setItem('obs-live-translate-settings', JSON.stringify(settings));
    addLog('设置已保存 (本地存储)', 'success');

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'update_config', data: settings }));
    }
  }

  function loadSettings() {
    const saved = localStorage.getItem('obs-live-translate-settings');
    if (saved) {
      try {
        const settings = JSON.parse(saved);
        if (settings.api_key) document.getElementById('apiKey').value = settings.api_key;
        if (settings.api_base_url) document.getElementById('apiBaseUrl').value = settings.api_base_url;
        if (settings.model) document.getElementById('modelName').value = settings.model;
        if (settings.music_detection !== undefined) document.getElementById('musicDetection').checked = settings.music_detection;
        if (settings.auto_language_detect !== undefined) document.getElementById('autoLangDetect').checked = settings.auto_language_detect;
        if (settings.silence_threshold) document.getElementById('silenceThreshold').value = settings.silence_threshold;
        if (settings.display_time) document.getElementById('displayTime').value = settings.subtitle_display_time;
      } catch (e) {}
    }
  }

  function toggleServer() {
    addLog(isServerRunning ? '正在停止服务...' : '正在启动服务...', 'warn');
    isServerRunning = !isServerRunning;
    updateButtons();
  }

  loadSettings();
  connect();
  addLog('控制面板已就绪');
})();
</script>
</body>
</html>
