# .github/workflows/build.yml
name: 🚀 跨平台自动构建

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建发布版本'
        type: boolean
        default: true

jobs:
  # ============================================================
  #  Windows 构建
  # ============================================================
  build-windows:
    name: 🪟 Windows x64
    runs-on: windows-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v5

      - name: 🐍 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔨 构建可执行文件
        run: |
          pyinstaller --onefile --console `
            --name "obs-live-translate" `
            --add-data "browser_source;browser_source" `
            --add-data "dock;dock" `
            --hidden-import sounddevice `
            --hidden-import numpy `
            --hidden-import websockets `
            --hidden-import aiohttp `
            --collect-all sounddevice `
            server/main.py

      - name: 📁 准备发布包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/obs-live-translate
          Copy-Item dist/obs-live-translate.exe release/obs-live-translate/
          Copy-Item -Recurse browser_source release/obs-live-translate/browser_source
          Copy-Item -Recurse dock release/obs-live-translate/dock
          
          @"
          @echo off
          chcp 65001 >nul
          title OBS Live Translate
          echo ============================================
          echo   OBS Live Translate - 实时字幕翻译
          echo ============================================
          echo.
          cd /d "%~dp0"
          start "" obs-live-translate.exe
          echo.
          echo 服务已启动! 请打开OBS添加浏览器源
          echo.
          echo 浏览器源URL: file:///%~dp0browser_source/subtitle.html
          echo 控制面板URL: file:///%~dp0dock/control_panel.html
          echo.
          echo 按任意键退出...
          pause >nul
          "@ | Out-File -FilePath release/obs-live-translate/启动.bat -Encoding UTF8

      - name: 📦 打包为 ZIP
        run: |
          Compress-Archive -Path release/obs-live-translate/* -DestinationPath obs-live-translate-windows-x64.zip

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: obs-live-translate-windows-x64
          path: obs-live-translate-windows-x64.zip
          retention-days: 30

  # ============================================================
  #  Linux 构建
  # ============================================================
  build-linux:
    name: 🐧 Linux x64
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v5

      - name: 🐍 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-dev

      - name: 📦 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔨 构建可执行文件
        run: |
          pyinstaller --onefile --console \
            --name "obs-live-translate" \
            --add-data "browser_source:browser_source" \
            --add-data "dock:dock" \
            --hidden-import sounddevice \
            --hidden-import numpy \
            --hidden-import websockets \
            --hidden-import aiohttp \
            --collect-all sounddevice \
            server/main.py

      - name: 📁 准备发布包
        run: |
          mkdir -p release/obs-live-translate
          cp dist/obs-live-translate release/obs-live-translate/
          cp -r browser_source release/obs-live-translate/
          cp -r dock release/obs-live-translate/
          
          cat > release/obs-live-translate/start.sh << 'EOF'
          #!/bin/bash
          echo "============================================"
          echo "  OBS Live Translate - 实时字幕翻译"
          echo "============================================"
          echo ""
          cd "$(dirname "$0")"
          chmod +x obs-live-translate
          ./obs-live-translate
          EOF
          chmod +x release/obs-live-translate/start.sh
          chmod +x release/obs-live-translate/obs-live-translate

      - name: 📦 打包为 tar.gz
        run: |
          cd release
          tar -czf ../obs-live-translate-linux-x64.tar.gz obs-live-translate/

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: obs-live-translate-linux-x64
          path: obs-live-translate-linux-x64.tar.gz
          retention-days: 30

  # ============================================================
  #  macOS Apple Silicon 构建
  # ============================================================
  build-macos:
    name: 🍎 macOS Apple Silicon
    runs-on: macos-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v5

      - name: 🐍 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 📦 安装系统依赖
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew install portaudio

      - name: 📦 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔨 构建可执行文件 (arm64)
        run: |
          pyinstaller --onefile --console \
            --name "obs-live-translate" \
            --add-data "browser_source:browser_source" \
            --add-data "dock:dock" \
            --hidden-import sounddevice \
            --hidden-import numpy \
            --hidden-import websockets \
            --hidden-import aiohttp \
            --target-arch arm64 \
            --collect-all sounddevice \
            server/main.py

      - name: 📁 准备发布包
        run: |
          mkdir -p release/obs-live-translate
          cp dist/obs-live-translate release/obs-live-translate/
          cp -r browser_source release/obs-live-translate/
          cp -r dock release/obs-live-translate/
          
          cat > release/obs-live-translate/start.command << 'EOF'
          #!/bin/bash
          echo "============================================"
          echo "  OBS Live Translate - 实时字幕翻译"
          echo "============================================"
          echo ""
          cd "$(dirname "$0")"
          chmod +x obs-live-translate
          ./obs-live-translate
          EOF
          chmod +x release/obs-live-translate/start.command
          chmod +x release/obs-live-translate/obs-live-translate
          
          codesign --force --deep --sign - release/obs-live-translate/obs-live-translate 2>/dev/null || true

      - name: 📦 打包为 zip
        run: |
          cd release
          zip -r ../obs-live-translate-macos-arm64.zip obs-live-translate/

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: obs-live-translate-macos-arm64
          path: obs-live-translate-macos-arm64.zip
          retention-days: 30

  # ============================================================
  #  创建 GitHub Release
  # ============================================================
  create-release:
    name: 📦 创建 Release
    needs: [build-windows, build-linux, build-macos]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 下载所有构建产物
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: 📋 整理产物
        run: |
          mkdir -p release-assets
          cp artifacts/obs-live-translate-windows-x64/obs-live-translate-windows-x64.zip release-assets/
          cp artifacts/obs-live-translate-linux-x64/obs-live-translate-linux-x64.tar.gz release-assets/
          cp artifacts/obs-live-translate-macos-arm64/obs-live-translate-macos-arm64.zip release-assets/
          
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 🚀 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OBS Live Translate ${{ github.ref_name }}"
          body: |
            ## 🎉 OBS Live Translate ${{ github.ref_name }}
            
            ### ✨ 功能特性
            - 🎙️ 实时系统音频捕获与字幕翻译
            - 🌐 中文直出 + 外语同声传译中文
            - 🎵 音乐检测（自动跳过音乐播放）
            - 🔇 静音检测（无人声时自动停止发送）
            - 🖥️ OBS 浏览器源 + 侧边栏控制台
            - 🔑 支持兼容 OpenAI 接口的各类大模型
            
            ### 📥 下载
            | 平台 | 文件 |
            |------|------|
            | 🪟 Windows x64 | `obs-live-translate-windows-x64.zip` |
            | 🐧 Linux x64 | `obs-live-translate-linux-x64.tar.gz` |
            | 🍎 macOS Apple Silicon | `obs-live-translate-macos-arm64.zip` |
            
            ### 📖 使用说明
            1. 下载对应平台的压缩包并解压
            2. 运行启动脚本
            3. 在 OBS 中添加「浏览器」源，URL 指向 `browser_source/subtitle.html`
            4. 在 OBS 中「视图 → 停靠部件 → 自定义浏览器停靠部件」，URL 指向 `dock/control_panel.html`
            5. 在控制面板中填入你的 API Key 并保存
            
            ### ⚠️ 音频捕获准备
            - **Windows**: 启用「立体声混音」设备
            - **macOS**: 安装 [BlackHole](https://github.com/ExistentialAudio/BlackHole)
            - **Linux**: 使用 PulseAudio Monitor
            
            ---
            *自动构建于 ${{ github.event.repository.updated_at }}*
          files: |
            release-assets/obs-live-translate-windows-x64.zip
            release-assets/obs-live-translate-linux-x64.tar.gz
            release-assets/obs-live-translate-macos-arm64.zip
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
