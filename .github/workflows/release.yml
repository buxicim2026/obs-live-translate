name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            out: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            out: linux-arm64
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            out: windows-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            out: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 cross deps
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Linux ARM64 linker
        if: matrix.cross
        run: |
          cat >> $GITHUB_WORKSPACE/.cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -e
          out="release/${{ matrix.out }}"
          rm -rf "$out"
          mkdir -p "$out/bin"
          ext=""
          case "${{ matrix.target }}" in
            *windows*) ext=".exe" ;;
          esac
          cp "target/${{ matrix.target }}/release/stream-live-translate$ext" "$out/bin/"
          cp -R dist/overlay dist/admin "$out/"
          cp dist/launcher.sh "$out/launcher.sh"
          chmod +x "$out/launcher.sh"
          cp dist/launcher.bat "$out/" 2>/dev/null || true
          cp dist/README.txt "$out/"
          case "${{ matrix.target }}" in
            *windows*)
              (cd release && powershell -Command "Compress-Archive -Path '${{ matrix.out }}' -DestinationPath '${{ matrix.out }}.zip'")
              ;;
            *)
              (cd release && tar -czf "${{ matrix.out }}.tar.gz" "${{ matrix.out }}")
              ;;
          esac
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/${{ matrix.out }}.tar.gz
            release/${{ matrix.out }}.zip
            release/${{ matrix.out }}.sha256
        if: startsWith(github.ref, 'refs/tags/')
